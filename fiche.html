<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiche de Partie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grenze+Gotisch:wght@600;700&display=swap">
<style>
/* Layout : en-tête collant (PV, CA, round) · contenu selon la phase de jeu · barre de résultat fixe · onglets en bas */
:root{
  --bg:#E8EAEE;--surface:#F8F9FB;--ink:#1A1F29;--muted:#5B6474;--line:#CBD1DA;
  --blood:#9B2C2C;--brass:#8A6A1F;--heal:#2D6B4C;--chip:#E1E5EB;--arcane:#4B4FA3;--scrim:rgba(12,14,20,.5);
  --display:'Grenze Gotisch',Georgia,serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318;--surface:#1B1F26;--ink:#E8EAEF;--muted:#98A1B0;--line:#2D333D;
  --blood:#E3645D;--brass:#D6B05A;--heal:#62C192;--chip:#262B34;--arcane:#9EA3F0;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111318;--surface:#1B1F26;--ink:#E8EAEF;--muted:#98A1B0;--line:#2D333D;
  --blood:#E3645D;--brass:#D6B05A;--heal:#62C192;--chip:#262B34;--arcane:#9EA3F0;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--chip);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button:active{transform:scale(.97)}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 10px;width:100%;min-width:0}
.muted{color:var(--muted);font-size:.85rem}
.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.big{min-height:58px;font-family:var(--display);font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.red{background:var(--blood);border-color:var(--blood);color:var(--surface)}
.linkbtn{background:transparent;border-color:transparent;color:var(--muted);font-weight:400;font-size:.88rem;padding:0 8px}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:8px 10px}
.idrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.idrow h1{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.idrow p{margin:0;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.vitals{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.vitals.two{grid-template-columns:1fr auto}
.hpbtn{display:flex;flex-direction:column;justify-content:center;gap:5px;text-align:left;padding:6px 12px;min-height:54px;background:var(--bg);border-color:var(--line)}
.hpbtn .n{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;font-weight:400;white-space:nowrap}
.hpbtn .n b{font-size:1.55rem;line-height:1;color:var(--blood)}
.hpbtn .n em{font-style:normal;font-weight:700;color:var(--brass);font-size:.85rem}
.hpbtn .n small{margin-left:auto;color:var(--muted);font-size:.75rem}
.bar{height:7px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blood);transition:width .25s}
.vt{min-width:60px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center}
.vt .lbl{font-size:.62rem}
.vt b{font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.vt.up{border-color:var(--arcane)}.vt.up b{color:var(--arcane)}
.vt.cb{border-color:var(--blood)}.vt.cb b{color:var(--blood)}

main{display:flex;flex-direction:column;gap:12px;padding-block:12px 190px}
.card{background:var(--surface);border:1px solid transparent;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.focus{border-color:var(--blood)}
.card.alert{border-color:var(--brass)}
.card.alert.danger{border-color:var(--blood)}
.card h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:.01em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400}
.card h3{font-size:.95rem;margin:4px 0 0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.notice{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Bascule de phase */
.phase{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;background:var(--surface);padding:4px;border-radius:12px}
.seg button{border-color:transparent;background:transparent;min-height:40px;font-size:.9rem}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg.light{background:var(--bg)}
.seg.light button.on{background:var(--surface);color:var(--ink);border-color:var(--line)}
.seg.light button.on.a1{color:var(--heal)}.seg.light button.on.a2{color:var(--blood)}

/* Sur moi */
.onme{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{min-height:36px;border-radius:18px;font-size:.85rem;padding:0 12px;background:var(--bg);font-weight:700}
.pill.fx{border-color:var(--arcane);color:var(--arcane)}
.pill.neg,.pill.cond{border-color:var(--blood);color:var(--blood)}
.pill.conc{border-color:var(--brass);color:var(--brass)}
.pill.add{border-style:dashed;color:var(--muted);font-weight:400}

/* Actions du tour */
.acts{display:flex;flex-wrap:wrap;gap:6px}
.act{flex:1 1 0;min-width:64px;min-height:46px;background:var(--ink);color:var(--surface);border-color:var(--ink);padding:0 6px;font-size:.9rem}
.act.spent{background:transparent;color:var(--muted);border-style:dashed;text-decoration:line-through;font-weight:400}
.act.haste{background:var(--arcane);border-color:var(--arcane)}
.act.haste.spent{background:transparent;color:var(--muted)}
.move{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.move .mv{flex:1 1 100%;display:flex;flex-direction:column;gap:4px;min-width:0}
.move button{flex:1 1 0}
.move .mv b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.move button{min-width:54px;padding:0 8px;font-size:.88rem}

/* Lignes compactes */
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.ln:first-child{padding-top:0}.ln:last-child{border-bottom:0;padding-bottom:0}
.ln .t{min-width:0;overflow-wrap:anywhere}
.ln .t small{display:block;color:var(--muted);font-size:.8rem}
.pips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pip{width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;border:2px solid var(--line);background:transparent}
.pip.on{background:var(--ink);border-color:var(--ink)}
.pip.sp.on{background:var(--brass);border-color:var(--brass)}
.pip.rs.on{background:var(--heal);border-color:var(--heal)}
.pip.f.on{background:var(--blood);border-color:var(--blood)}
.pip.s.on{background:var(--heal);border-color:var(--heal)}

/* Attaques */
.atk{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.atk:first-of-type{padding-top:0}
.atk .an{min-width:0;overflow-wrap:anywhere}
.atk .an b{display:block}
.atk .an small{color:var(--muted)}
.atk button{font-variant-numeric:tabular-nums;min-width:62px}
.atk .hit{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.atk .dmgb.crit{background:var(--heal);border-color:var(--heal);color:var(--surface)}
.qty{display:flex;align-items:center;gap:6px}
.qty b{min-width:2.4ch;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums}
.qty button{width:44px;padding:0;font-size:1.2rem}
.x{background:transparent;border-color:transparent;color:var(--muted);min-width:40px;padding:0}
.heal{background:var(--heal);border-color:var(--heal);color:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;border-radius:19px;font-weight:400;font-size:.9rem}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.ab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab .field{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.ab input{text-align:center;font-size:1.2rem;font-weight:700;background:var(--surface)}
.ab .m{font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.slotsEdit{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slotsEdit input{text-align:center;padding:6px 4px}
.edit{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.edit input,.edit select{background:var(--surface)}
.edit .head{display:flex;gap:6px;align-items:center}
.edit .head input{flex:1}
.danger-btn{background:transparent;border-color:var(--blood);color:var(--blood)}
.danger-btn.armed{background:var(--blood);color:var(--surface)}
.card h2 small a{color:inherit}
.plist{display:flex;flex-direction:column;gap:6px}
.pc{display:flex;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;font-weight:400;padding:6px 12px}
.pc b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc small{color:var(--muted);flex:none}
.pc.on{border-color:var(--ink);background:var(--surface)}.pc.on b{font-weight:700}
.prof{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.prof button{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:400;text-align:left;min-height:42px;padding:0 10px;font-size:.88rem}
.prof button i{font-style:normal;font-weight:700;color:var(--muted);font-size:.75rem}
.prof button.p1{border-color:var(--ink);font-weight:700}
.prof button.p2{border-color:var(--brass);background:var(--surface);font-weight:700}
.prof button.p1 i,.prof button.p2 i{color:var(--brass)}

.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.coins .field{text-align:center}
.coins input{text-align:center;font-weight:700}
.item{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{background:transparent;border-color:transparent;text-align:left;font-weight:400;padding:0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.item .nm span{overflow-wrap:anywhere}
.item .nm small{color:var(--muted);font-size:.78rem}
.item .nm small.eq{color:var(--arcane);font-weight:700}
.item .qty b{font-size:1.1rem}
.item .qty button{width:40px;min-height:40px;font-size:1.1rem}
.item .edit{grid-column:1/-1}

.entry{border-left:3px solid var(--line);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:2px}
.entry[data-k="Idée"]{border-color:var(--brass)}
.entry[data-k="Quête"]{border-color:var(--blood)}
.entry[data-k="PNJ"]{border-color:var(--heal)}
.entry .eh{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted)}
.entry p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
textarea{min-height:84px;resize:vertical}

.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dice button{min-height:56px;font-size:1.15rem;font-family:var(--display);font-weight:700}
.dice button.d20{grid-column:span 2;background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tests{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tests button,.sk button{display:flex;justify-content:space-between;align-items:center;gap:6px;font-variant-numeric:tabular-nums;padding:0 10px;min-height:46px}
.tests button span,.sk button span{font-weight:400;font-size:.88rem;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tests button.pr,.sk button.pr{border-color:var(--ink)}
.tests button.pr span::after,.sk button.pr span::after{content:" ●";color:var(--brass)}
.sk button.ex span::after{content:" ◆";color:var(--brass)}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sk button small{color:var(--muted);font-weight:400;font-size:.7rem;margin-left:4px}
.hist{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-variant-numeric:tabular-nums}
.hist div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.hist div b{color:var(--ink)}
.step{display:flex;align-items:center;gap:6px}
.step b{min-width:3ch;text-align:center;font-variant-numeric:tabular-nums;font-size:1.2rem}
.step button{width:44px;padding:0}

/* Barre de résultat fixe */
.rbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.rbar .in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.rbar .rt{font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.rbar.crit .rt{color:var(--heal)}.rbar.fumble .rt{color:var(--blood)}
.rbar .rtx{flex:1 1 0;min-width:0;background:transparent;border-color:transparent;text-align:left;padding:0;min-height:40px;font-weight:400;display:flex;flex-direction:column;justify-content:center}
.rbar .rl{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .rl i{font-style:normal;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.rbar.crit .rl i{background:var(--heal);color:var(--surface)}.rbar.fumble .rl i{background:var(--blood);color:var(--surface)}
.rbar .rd{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .rd.open{white-space:normal}
.rbar .ex{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.rbar .ex button{min-height:36px;font-size:.82rem;background:var(--arcane);border-color:var(--arcane);color:var(--surface);flex:1 1 auto}

/* Feuille modale */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;display:flex;justify-content:space-between;align-items:center}
.padv{text-align:center;font-size:2.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;min-height:3.1rem}
.padv.ph{color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:56px;font-size:1.4rem;font-variant-numeric:tabular-nums}
.padact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.padact button{min-height:56px}
.fx{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--bg);border-left:4px solid var(--arcane)}
.fx.neg{border-left-color:var(--blood)}
.fx b{min-width:0;overflow-wrap:anywhere}
.fx small{grid-column:1;color:var(--muted)}
.fx .x{grid-row:1/span 2;grid-column:2}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{min-height:38px;border-radius:19px;font-weight:400;font-size:.88rem}
.presets button.neg{border-color:var(--blood);color:var(--blood)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:transparent;border-color:transparent;font-size:.82rem;min-height:48px;color:var(--muted);padding:0 2px}
nav.tabs button.on{color:var(--ink);background:var(--chip)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);
  padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:380px){.tests{grid-template-columns:1fr 1fr}.vt{min-width:52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none}}
</style>

<header class="top"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="view"></main>
<div class="rbar" id="rbar"></div>
<nav class="tabs" id="tabs">
  <button data-tab="combat">Jeu</button>
  <button data-tab="jets">Jets</button>
  <button data-tab="sac">Sac</button>
  <button data-tab="journal">Journal</button>
  <button data-tab="fiche">Fiche</button>
</nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="impf" accept=".json,application/json" hidden>

<script>
const KEY='dd-fiche-partie-v1',KEY2='dd-fiche-personnages-v1';
const STATS=['FOR','DEX','CON','INT','SAG','CHA'];
const SKILLS=[['Acrobaties','DEX'],['Arcanes','INT'],['Athlétisme','FOR'],['Discrétion','DEX'],['Dressage','SAG'],['Escamotage','DEX'],
 ['Histoire','INT'],['Intimidation','CHA'],['Intuition','SAG'],['Investigation','INT'],['Médecine','SAG'],['Nature','INT'],
 ['Perception','SAG'],['Persuasion','CHA'],['Religion','INT'],['Représentation','CHA'],['Survie','SAG'],['Tromperie','CHA']];
const CONDS=['À terre','Agrippé','Assourdi','Aveuglé','Charmé','Effrayé','Empoisonné','Entravé','Étourdi','Inconscient','Invisible','Neutralisé','Paralysé','Pétrifié'];
/* Effet des états sur tes propres jets d20 : [portée, +1 avantage / -1 désavantage] */
const COND_ADV={'À terre':[['atk',-1]],'Aveuglé':[['atk',-1]],'Effrayé':[['atk',-1],['chk',-1]],'Empoisonné':[['atk',-1],['chk',-1]],'Entravé':[['atk',-1]],'Invisible':[['atk',1]]};
const SCOPES=[['atk','Attaque'],['dmg','Dégâts'],['save','Sauvegarde'],['chk','Test'],['ac','CA']];
const KINDS_FX=[['die','Dé en plus'],['dieneg','Dé en moins'],['flat','Bonus / malus fixe'],['adv','Avantage'],['dis','Désavantage'],['reroll','Relance']];
const PRESETS=[
 {n:'Bénédiction',sc:['atk','save'],kind:'die',val:'1d4',dur:'rounds',left:10},
 {n:'Inspiration bardique',sc:['atk','save','chk'],kind:'die',val:'1d6',dur:'once'},
 {n:'Assistance',sc:['chk'],kind:'die',val:'1d4',dur:'once'},
 {n:'Aide',sc:['atk','chk'],kind:'adv',dur:'once'},

/* Dés : "1d8+3", "2d6+1d4+2", "d10-1" */
function rollExpr(expr,double){
 const terms=String(expr).replace(/\s/g,'').toLowerCase().match(/[+-]?[^+-]+/g)||[];
 let tot=0;const parts=[];
 for(const t of terms){const sign=t[0]==='-'?-1:1,b=t.replace(/^[+-]/,'');
  const m=b.match(/^(\d*)d(\d+)$/);
  if(m){let n=(+m[1]||1)*(double?2:1),d=+m[2];const rs=Array.from({length:n},()=>rnd(d));tot+=sign*rs.reduce((x,y)=>x+y,0);parts.push((sign<0?'− ':'')+'['+rs.join(',')+']')}
  else if(/^\d+$/.test(b)){tot+=sign*+b;parts.push((sign<0?'− ':'+ ')+b)}}
 return{tot,det:parts.join(' ')||'—'};
}
function fxVal(f,crit){
 if(f.kind==='die')return rollExpr(f.val,crit).tot;
 if(f.kind==='dieneg')return -rollExpr(f.val,crit).tot;
 if(f.kind==='flat')return +f.val||0;
 return null;
}

/* Jet d20 avec avantage, effets actifs, états et épuisement */
function d20(m,label,scope){
 const fx=scope?fxOf(scope):[];
 const src=[];
 if(S.adv===1)src.push([1,'choisi']);if(S.adv===2)src.push([-1,'choisi']);
 fx.forEach(f=>{if(f.kind==='adv')src.push([1,f.n]);if(f.kind==='dis')src.push([-1,f.n])});
 S.conds.forEach(c=>(COND_ADV[c]||[]).forEach(([sc,v])=>{if(sc===scope)src.push([v,c])}));
 const up=src.filter(x=>x[0]>0),dn=src.filter(x=>x[0]<0);
 const a=rnd(20),b=rnd(20);let nat=a,det=String(a);
 if(up.length&&!dn.length){nat=Math.max(a,b);det=`${a}|${b} avantage (${up.map(x=>x[1]).join(', ')})`}
 else if(dn.length&&!up.length){nat=Math.min(a,b);det=`${a}|${b} désavantage (${dn.map(x=>x[1]).join(', ')})`}
 else if(up.length&&dn.length)det=`${a} (avantage et désavantage s'annulent)`;
 let add=m;const parts=m?[sg(m)]:[];
 fx.forEach(f=>{if(manualFx(f))return;const v=fxVal(f,false);if(v===null)return;add+=v;parts.push(`${sg(v)} ${f.n}`)});
 if(S.exh){add-=2*S.exh;parts.push(`−${2*S.exh} épuisement`)}
 dropFx(fx.filter(f=>f.dur==='once'&&(f.kind==='adv'||f.kind==='dis')).map(f=>f.id));
 return{t:Date.now(),l:label,tot:nat+add,det:[det,...parts].join(' '),d20:true,nat,m:add,scope};
}

function damage(n){
 if(S.tmp){const t=Math.min(S.tmp,n);S.tmp-=t;n-=t}
 if(S.hp===0&&n>0){S.saves.f=Math.min(3,S.saves.f+1);toast('PV à 0 : un échec de sauvegarde contre la mort')}
 S.hp=Math.max(0,S.hp-n);
 if(S.conc&&n>0)S.concDD=Math.max(S.concDD||0,Math.min(30,Math.max(10,Math.floor(n/2))));
}
function heal(n){if(S.hp===0&&n>0)S.saves={s:0,f:0};S.hp=Math.min(S.hpMax,S.hp+n)}
function startTurn(){
 S.round++;S.turn=freshTurn();S.phase='mine';
 const ended=[];S.fx.forEach(f=>{if(f.dur==='rounds'){f.left--;if(f.left<=0)ended.push(f)}});
 dropFx(ended.map(f=>f.id));
 if(ended.length)toast(`Terminé : ${ended.map(f=>f.n).join(', ')}`);
 window.scrollTo(0,0);
}
function addFx(p){S.fx.push(Object.assign({},p,{id:uid(),src:S.fxSrc.trim(),sc:[...p.sc]}));toast(`${p.n} ajouté`)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a],[data-tab]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.sheet=null;armed=false;render();window.scrollTo(0,0);return}
 const a=t.dataset.a;
 const i=+t.dataset.i,v=+t.dataset.v,id=t.dataset.id;
 if(a!=='pdel')armed=false;
 switch(a){
  case 'sheet':S.sheet=t.dataset.v;S.pad='';break;
  case 'close':S.sheet=null;break;
  case 'key':{const k=t.dataset.v;if(k==='c')S.pad='';else if(k==='b')S.pad=S.pad.slice(0,-1);else if(S.pad.length<3)S.pad=(S.pad+k).replace(/^0+/,'');break}
  case 'padgo':{const n=parseInt(S.pad,10)||0,k=t.dataset.v;if(!n&&k!=='tmp')return toast('Tape une valeur');
   if(k==='dmg'){damage(n);toast(`−${n} PV`)}else if(k==='heal'){heal(n);toast(`+${n} PV`)}else{if(!n){S.tmp=0;toast('PV temporaires retirés')}else{S.tmp=Math.max(S.tmp,n);toast(`${S.tmp} PV temporaires`)}}
   S.pad='';S.sheet=null;break}
  case 'rbx':S.rbOpen=!S.rbOpen;break;
  case 'phase':S.phase=t.dataset.v;window.scrollTo(0,0);break;
  case 'fight':{S.mode='combat';S.round=0;S.turn=freshTurn();S.phase='wait';S.pick=false;push(d20(S.init,'Initiative','chk'));window.scrollTo(0,0);break}
  case 'newturn':startTurn();break;
  case 'endturn':S.phase='wait';S.crit=false;window.scrollTo(0,0);break;
  case 'endfight':{S.mode='explo';S.round=0;S.turn=freshTurn();S.crit=false;S.phase='wait';S.pick=S.ammo.some(x=>x.spent);note('Note','Fin du combat');toast('Combat terminé');window.scrollTo(0,0);break}
  case 'nopick':S.pick=false;break;
  case 'tact':{const k=t.dataset.k;S.turn[k]=!S.turn[k];break}
  case 'mv':S.turn.move=Math.max(0,Math.min(speedNow(),S.turn.move+v));break;
  case 'dash':S.turn.dash=true;spend('action');break;
  case 'concroll':{const r=d20(svB('CON'),`Concentration DD ${S.concDD}`,'save');push(r);
   if(r.tot>=S.concDD)toast('Concentration maintenue');else{S.conc=false;toast('Concentration perdue')}S.concDD=0;break}
  case 'concok':S.concDD=0;break;
  case 'conclost':S.conc=false;S.concDD=0;break;
  case 'ds':{const k=t.dataset.k;S.saves[k]=i<S.saves[k]?i:i+1;if(S.saves.s===3)toast('Stabilisé');if(S.saves.f===3)toast('Trois échecs…');break}
  case 'dsroll':{const r=d20(0,'Sauvegarde contre la mort','save');push(r);const n=r.nat;
   if(n===20){S.hp=1;S.saves={s:0,f:0};toast('20 naturel : tu reviens à 1 PV')}
   else if(n===1){S.saves.f=Math.min(3,S.saves.f+2);toast('1 naturel : deux échecs')}
   else if(r.tot>=10){S.saves.s=Math.min(3,S.saves.s+1);toast(S.saves.s===3?'Stabilisé':'Succès')}
   else{S.saves.f=Math.min(3,S.saves.f+1);toast(S.saves.f===3?'Trois échecs…':'Échec')}break}
  case 'atk':{const at=S.attacks[i];
   if(at.ammo){const am=S.ammo.find(x=>x.n===at.ammo);if(am){if(!am.q)return toast(`Plus de ${am.n.toLowerCase()}`);am.q--;am.spent++}}
   const r=d20(+at.hit||0,at.n,'atk');push(r);S.crit=r.nat===20;if(!S.turn.action)spend('action');break}
  case 'adm':{const at=S.attacks[i],x=rollExpr(at.dmg,S.crit);let tot=x.tot;const parts=[x.det];
   fxOf('dmg').forEach(f=>{if(manualFx(f))return;const v=fxVal(f,S.crit);if(v===null)return;tot+=v;parts.push(`${sg(v)} ${f.n}`)});
   push({t:Date.now(),l:`Dégâts ${at.n}`,tot:Math.max(0,tot),det:parts.join(' '),critDmg:S.crit,scope:'dmg'});S.crit=false;break}
  case 'fxadd':{const r=S.rolls[0],f=S.fx.find(x=>x.id===id);if(!r||!f)break;const v=fxVal(f,!!r.critDmg);r.tot+=v;r.m=(r.m||0)+v;r.det+=` ${sg(v)} ${f.n}`;dropFx([id]);toast(`${f.n} : ${sg(v)}`);break}
  case 'fxre':{const r=S.rolls[0],f=S.fx.find(x=>x.id===id);if(!r||!f)break;const n=rnd(20);
   push({t:Date.now(),l:`${r.l} (relance)`,tot:n+(r.m||0),det:`${n} ${sg(r.m||0)} · relance ${f.n}`,d20:true,nat:n,m:r.m,scope:r.scope});
   if(r.scope==='atk')S.crit=n===20;dropFx([id]);break}
  case 'custom':S.showCustom=!S.showCustom;break;
  case 'fxpre':addFx(PRESETS[i]);break;
  case 'fxsc':{const k=t.dataset.k,D=S.fxD;D.sc=D.sc.includes(k)?D.sc.filter(x=>x!==k):[...D.sc,k];break}
  case 'fxcustom':{const D=S.fxD;if(!D.n.trim())return toast('Donne un nom à l\'effet');if(!D.sc.length&&D.kind!=='reroll')return toast('Choisis sur quoi il joue');
   if(['die','dieneg'].includes(D.kind)&&!/d\d+/i.test(D.val))return toast('Indique un dé, par exemple 1d4');
   addFx({n:D.n.trim(),sc:D.kind==='reroll'&&!D.sc.length?['atk','save','chk']:D.sc,kind:D.kind,val:D.kind==='flat'?parseInt(D.val,10)||0:D.val,dur:D.dur,left:Math.max(1,+D.left||1)});
   S.fxD={n:'',sc:['atk'],kind:'die',val:'1d4',dur:'rounds',left:10};S.showCustom=false;break}
  case 'fxdel':dropFx([id]);break;
  case 'ini':push(d20(S.init,'Initiative','chk'));break;
  case 'use':{const it=S.inv[i];if(!it)break;const ac=it.act||'action';
   if(it.type==='charges'){if(!(+it.ch>0))return;it.ch=+it.ch-1}else{if(!(it.q>0))return;it.q--}
   if(it.type==='soin'){const x=rollExpr(it.dice||'2d4+2');const g=Math.max(0,x.tot);heal(g);push({t:Date.now(),l:it.n,tot:g,det:`${x.det} PV rendus`})}
   else toast(`${it.n} utilisé`);
   spend(ac);note('Butin',`Utilisé : ${it.n}`);break}
  case 'aq':{const am=S.ammo[i];if(v<0){if(!am.q)return toast('Plus de munitions');am.q--;am.spent++}else{am.q++;if(am.spent)am.spent--}break}
  case 'pick':{const am=S.ammo[i],g=Math.floor(am.spent/2);am.q+=g;am.spent=0;toast(`+${g} ${am.n.toLowerCase()} récupérée${g>1?'s':''}`);if(!S.ammo.some(x=>x.spent))S.pick=false;break}
  case 'adel':S.ammo.splice(i,1);break;
  case 'aadd':{const n=document.getElementById('newAmmo').value.trim();if(!n)return;S.ammo.push({n,q:20,spent:0});break}
  case 'slot':{const s=S.slots[+t.dataset.l],j=+t.dataset.j;s.used=j>=s.used?j+1:j;break}
  case 'res':{const r=S.res[i],j=+t.dataset.j;r.used=j>=r.used?j+1:j;break}
  case 'cond':{const n=t.dataset.n;S.conds=S.conds.includes(n)?S.conds.filter(c=>c!==n):[...S.conds,n];break}
  case 'conc':S.conc=!S.conc;if(!S.conc)S.concDD=0;break;
  case 'exh':S.exh=Math.max(0,Math.min(6,S.exh+v));break;
  case 'hd':{if(!hdLeft())return;const r=rnd(S.hd.die),c=mod(S.stats.CON),g=Math.max(0,r+c);S.hd.used++;heal(g);
   push({t:Date.now(),l:'Dé de vie',tot:g,det:`${r} ${sg(c)} PV rendus`});break}
  case 'short':S.res.forEach(r=>{if(r.rest==='court')r.used=0});note('Note','Repos court');toast('Repos court : capacités « court » rechargées');break;
  case 'long':S.hp=S.hpMax;S.tmp=0;S.saves={s:0,f:0};S.slots.forEach(s=>s.used=0);S.res.forEach(r=>r.used=0);
   S.hd.used=Math.max(0,S.hd.used-Math.max(1,Math.floor(S.lvl/2)));S.exh=Math.max(0,S.exh-1);note('Note','Repos long');toast('Repos long : PV, sorts et capacités restaurés');break;
  case 'skill':{const n=t.dataset.n;push(d20(skB(n),n,'chk'));break}
  case 'save':{const s=t.dataset.s;push(d20(svB(s),`Sauvegarde ${s}`,'save'));break}
  case 'chk':{const s=t.dataset.s;push(d20(mod(S.stats[s]),`Test ${s}`,'chk'));break}
  case 'psave':{const s=t.dataset.s;S.saveProf=S.saveProf.includes(s)?S.saveProf.filter(x=>x!==s):[...S.saveProf,s];S.example=false;break}
  case 'pskill':{const n=t.dataset.n;S.skills[n]=((S.skills[n]||0)+1)%3;S.example=false;break}
  case 'atadd':S.attacks.push({n:'Nouvelle arme',hit:S.prof+mod(S.stats.FOR),dmg:'1d6',ammo:'',note:''});S.example=false;break;
  case 'atdel':S.attacks.splice(i,1);break;
  case 'rsadd':S.res.push({n:'Nouvelle capacité',max:1,used:0,rest:'long'});S.example=false;break;
  case 'rsdel':S.res.splice(i,1);break;
  case 'psw':if(DB.persos[id])setActive(id);break;
  case 'newp':addP(blank(),'fiche');toast('Nouveau personnage');break;
  case 'demo':addP(sample(),'combat');toast('Exemple ajouté');break;
  case 'pdel':{if(!armed){armed=true;break}armed=false;delete DB.persos[DB.actif];const ids=Object.keys(DB.persos);
   if(ids.length)setActive(ids[0]);else addP(blank(),'fiche');toast('Personnage supprimé');break}
  case 'exp':{const n=(S.name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'personnage';
   const u=URL.createObjectURL(new Blob([JSON.stringify({format:'fiche-partie',version:1,personnage:S},null,1)],{type:'application/json'}));
   const l=document.createElement('a');l.href=u;l.download=n+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Fichier exporté');return}
  case 'imp':document.getElementById('impf').click();return;
  case 'iopen':S.openItem=S.openItem===i?-1:i;break;
  case 'ieq':S.inv[i].eq=!S.inv[i].eq;break;
  case 'iq':S.inv[i].q=Math.max(0,S.inv[i].q+v);break;
  case 'idel':S.inv.splice(i,1);S.openItem=-1;break;
  case 'iadd':{const n=document.getElementById('newItem').value.trim();if(!n)return;S.inv.push({n,q:1,type:'objet'});break}
  case 'jk':S.jk=t.dataset.n;break;
  case 'jadd':{const x=(document.getElementById('jtxt').value||'').trim();if(!x)return toast('Écris quelque chose');note(S.jk,x);S.draft='';break}
  case 'jdel':S.log.splice(i,1);break;
  case 'adv':S.adv=v;break;
  case 'dc':S.dc=Math.max(1,Math.min(20,S.dc+v));break;
  case 'dm':S.dm=Math.max(-20,Math.min(30,S.dm+v));break;
  case 'roll':{const d=+t.dataset.d;
   if(d===20&&S.dc===1)push(d20(S.dm,`d20${S.dm?sg(S.dm):''}`));
   else{const rs=Array.from({length:S.dc},()=>rnd(d));const sum=rs.reduce((x,y)=>x+y,0);
    push({t:Date.now(),l:`${S.dc}d${d}${S.dm?sg(S.dm):''}`,tot:sum+S.dm,det:rs.join(' + ')+(S.dm?` ${sg(S.dm)}`:'')})}
   break}
  default:return;
 }
 render();
});
document.getElementById('impf').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{if(f.size>2e6)return toast('Fichier trop gros pour une fiche');
  const j=JSON.parse(await f.text()),env=!!j&&j.format==='fiche-partie';
  if(env&&j.version>1)return toast('Fichier d\'une version plus récente de la fiche');
  const p=env?j.personnage:j;
  if(!p||typeof p!=='object'||!p.stats||typeof p.stats!=='object')return toast('Fichier invalide : ce n\'est pas une fiche de personnage');
  addP(complete(p),S.tab);render();toast(`${p.name||'Personnage'} importé`)}
 catch(err){toast('Fichier illisible ou invalide, rien n\'a été changé')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='jtxt'){S.draft=e.target.value;save()}
 const f=e.target.dataset.f;
 if(f==='fxSrc'){S.fxSrc=e.target.value;save()}
 if(f==='fxD.n'||f==='fxD.val'){S.fxD[f.split('.')[1]]=e.target.value;save()}
});
document.addEventListener('change',e=>{
 const f=e.target.dataset.f;if(!f)return;
 const raw=e.target.value,num=parseInt(raw,10)||0,p=f.split('.'),k=p[0];
 if(k==='fxSrc'){S.fxSrc=raw;save();return}
 if(k==='fxD'){if(p[1]==='left')S.fxD.left=Math.max(1,num);else S.fxD[p[1]]=raw;
  if(p[1]==='kind'){S.fxD.val=raw==='flat'?'2':'1d4'}
  if(p[1]==='kind'||p[1]==='dur')render();else save();return}
 if(k==='inv'){const it=S.inv[+p[1]];if(!it)return;const fk=p[2];
  if(['ch','chMax','acb'].includes(fk))it[fk]=num;else it[fk]=raw.trim();
  if(fk==='type'){if(raw==='soin'&&!it.dice){it.dice='2d4+2';it.act=it.act||'bonus'}if(raw==='charges'&&!it.chMax){it.chMax=3;it.ch=3}}
  render();return}
 if(k==='stats'){S.stats[p[1]]=num;const m=document.getElementById('m_'+p[1]);if(m)m.textContent=sg(mod(num))}
 else if(k==='coins')S.coins[p[1]]=Math.max(0,num);
 else if(k==='slots'){const s=S.slots[+p[1]];s.max=Math.max(0,Math.min(9,num));s.used=Math.min(s.used,s.max)}
 else if(k==='hd')S.hd.die=num||8;
 else if(k==='attacks'){const at=S.attacks[+p[1]];at[p[2]]=p[2]==='hit'?num:raw.trim()}
 else if(k==='res'){const r=S.res[+p[1]];if(p[2]==='max'){r.max=Math.max(0,Math.min(20,num));r.used=Math.min(r.used,r.max)}else r[p[2]]=raw.trim()}
 else if(['name','cls','race','guild'].includes(k))S[k]=raw.trim();
 else S[k]=num;
 if(k==='hpMax')S.hpMax=Math.max(1,S.hpMax);
 if(k==='lvl'){S.lvl=Math.max(1,Math.min(20,S.lvl));S.hd.used=Math.min(S.hd.used,S.lvl)}
 S.hp=Math.max(0,Math.min(S.hp,S.hpMax));
 S.example=false;
 document.getElementById('hdr').innerHTML=vHeader();save();
});
render();
</script>
