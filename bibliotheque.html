  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--texte); font: 15px/1.45 var(--police); }
    main { max-width: 1100px; margin: 0 auto; padding: 0 max(var(--esp-4), env(safe-area-inset-right)) var(--esp-4) max(var(--esp-4), env(safe-area-inset-left)); display: flex; flex-direction: column; gap: var(--esp-3); }
    h1 { margin: var(--esp-3) 0 0; font-size: 26px; }
    .sous-titre { margin: 0; color: var(--texte-doux); }
    #bibliotheque { display: flex; flex-direction: column; gap: var(--esp-3); }
    :focus-visible { outline: var(--focus); outline-offset: var(--focus-decalage); }
    #bibliotheque .bib-corps { min-height: 360px; }
    #bibliotheque .bib-grille { max-height: 70vh; }
    #bibliotheque .bib-detail { position: sticky; top: var(--esp-4); align-self: start; max-height: 80vh; }
    #bibliotheque .bib-message p { background: var(--panneau); border: 1px solid var(--bord); border-radius: var(--rayon); padding: var(--esp-3); }
    @media (max-width: 760px) {
      #bibliotheque .bib-corps { grid-template-columns: 1fr; grid-template-rows: auto; }
      #bibliotheque .bib-grille { max-height: none; }
      #bibliotheque .bib-detail { position: static; max-height: none; }
    }
  </style>
